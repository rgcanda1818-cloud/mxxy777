services:
  - type: web
    name: northgate-store
    runtime: python
    plan: starter
    region: oregon
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: NORTHGATE_HOST
        value: 0.0.0.0
      - key: NORTHGATE_MAX_CONCURRENT_REQUESTS
        value: "64"
      - key: DATABASE_URL
        fromDatabase:
          name: northgate-db
          property: connectionString

databases:
  - name: northgate-db
    databaseName: northgate
    user: northgate
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
